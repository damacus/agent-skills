# Architecture-as-lint: adjust `msrv` to the crate's rust-version and point
# each disallowed method at the project's designated legitimate site(s),
# then annotate those sites with `#[allow(clippy::disallowed_methods)]`
# and a one-line reason.

msrv = "1.85"
cognitive-complexity-threshold = 30

disallowed-methods = [
    # Confine environment reads to the designated config loader(s).
    { path = "std::env::var", reason = "read configuration via the designated config loader" },
    # Confine process termination to the deliberate lifecycle point(s).
    { path = "std::process::exit", reason = "fail-fast only at the supervised daemon lifecycle point" },
]
